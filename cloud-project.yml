name: Clipbook
options:
  deploymentTarget: {macOS: '14.0'}
settings:
  base:
    DEVELOPMENT_TEAM: B9LJH93LA4
    # Release for any Mac: Developer ID Application with the Developer ID (direct distribution)
    # profile, which carries iCloud and has no device list. Never Apple Development, never a
    # profile that lists machines. scripts/developer-id-profile.py puts the profile on the build Mac.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Developer ID Application
    OTHER_CODE_SIGN_FLAGS: --timestamp
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    SWIFT_VERSION: '5.0'
  configs:
    Debug:
      CLIP_CLOUD_ENVIRONMENT: Development
    Release:
      CLIP_CLOUD_ENVIRONMENT: Production
targets:
  Clipbook:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: icon/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.clipbook
        CODE_SIGN_ENTITLEMENTS: Cloud.entitlements
        PROVISIONING_PROFILE_SPECIFIER: Clip Developer ID
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Clip
        INFOPLIST_KEY_CFBundleName: Clip
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        MARKETING_VERSION: '1.2.1'
        CURRENT_PROJECT_VERSION: '2'
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The agent CLI is a mode of the same executable: Contents/Resources/bin/clip -> ../../MacOS/Clipbook.
    # Created before Xcode's final code signing so the link is sealed into the bundle.
    postBuildScripts:
      - name: Link clip command
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin"
          ln -sfn ../../MacOS/Clipbook "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin/clip"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/clip
        basedOnDependencyAnalysis: false
    info:
      path: build/CloudInfo.plist
      properties:
        CFBundleName: Clip
        CFBundleDisplayName: Clip
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ClipCloudEnvironment: $(CLIP_CLOUD_ENVIRONMENT)
        LSUIElement: false
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLSchemes: [clipbook]
