# App Store variant; the existing build.sh/release-local.sh remain unchanged.
name: Clip
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: B9LJH93LA4
targets:
  Clip:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../Sources
        excludes:
          - Native/CLISelfTest.swift
          - Shared/AppLifecycleCLI.swift
          - Shared/AppLifecycle.swift
          - Shared/AppLifecycleUI.swift
      - path: Assets.xcassets
    dependencies:
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: Carbon.framework
      - sdk: ApplicationServices.framework
      - sdk: ServiceManagement.framework
      - sdk: CoreData.framework
      - sdk: CloudKit.framework
      - sdk: CryptoKit.framework
      - sdk: ImageIO.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: Check shared version and store specification
        script: /bin/bash "$SRCROOT/check.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Link clip command
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin"
          ln -sfn ../../MacOS/Clipbook "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin/clip"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/clip
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.clipbook
        PRODUCT_NAME: Clip
        EXECUTABLE_NAME: Clipbook
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE APP_LIFECYCLE_KVS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
    info:
      path: Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleName: Clip
        CFBundleDisplayName: Clip
        CFBundleExecutable: Clipbook
        CFBundlePackageType: APPL
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: false
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        ClipDistribution: store
        ClipCloudEnvironment: Production
        CFBundleURLTypes:
          - CFBundleURLName: cyou.tianli.clipbook
            CFBundleURLSchemes: [clipbook]
    entitlements:
      path: Clip.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Settings export/import and image exports use system-selected files.
        com.apple.security.files.user-selected.read-write: true
        # Optional title retrieval for copied web links; no incoming network service.
        com.apple.security.network.client: true
        # Optional family history archive; the primary library stays in this app's sandbox.
        com.apple.developer.icloud-container-identifiers: [iCloud.cyou.tianli.clip]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.aps-environment: production
        # Opt-in configuration sync is independent of history sync.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
