name: clipbook
domain: apps-mac
function: >-
  自用剪贴板历史（替代 Deck）。菜单栏常驻，⌘⇧V 唤出 nonactivating 浮动面板：
  记录文本/链接/图片/文件（优先级 文件>文本>图片，跳过密码管理器的 Concealed/Transient），
  子串搜索、置顶、回车粘贴（授权辅助功能后自动补 ⌘V）、同内容去重顶到最上、超 5000 条淘汰。
  **全 Swift 原生**（swiftc 直编，无 SPM / 无 xcodeproj / 无后端进程 / 无网络）。
  只做 Deck 实测在用的 20%：不做 AI、跨设备同步、SmartRules、标签。
public_api: "TL Clipbook.app（菜单栏常驻）· 全局 ⌘⇧V · clipbook://show|hide|toggle · build/Clipbook --selftest"
key_scripts:
  - Sources/ClipbookApp.swift          # @main：--selftest 分流；MenuBarExtra 菜单；AppDelegate 起面板/热键/URL scheme
  - Sources/Native/Store.swift         # SQLite 落盘：去重顶上、LIKE 搜索（含转义）、置顶、留存淘汰、blob 管理
  - Sources/Native/Watcher.swift       # 轮询 changeCount；extract() 纯函数 = 抓取优先级 SSOT
  - Sources/Native/Paster.swift        # 写回剪贴板 + CGEvent ⌘V（需辅助功能，不假装成功）
  - Sources/Native/HotKey.swift        # Carbon 全局热键候选表（登记在 ~/Dev/tools/configs/hotkeys.yaml）
  - Sources/Native/Panel.swift         # nonactivating NSPanel：不激活本 app，粘贴落在用户原 app
  - Sources/Native/PanelView.swift     # SwiftUI 面板：搜索 / 列表 / 预览 / 底栏状态（如实报未授权、Deck 在跑）
  - Sources/Native/AppModel.swift      # 界面状态与动作
  - Sources/Native/SelfTest.swift      # --selftest 判据（build.sh 阻断门）
  - build.sh                           # 四道 fail-closed 门 + swiftc + 打包 + 签名 + 装机
  - icon/AppIcon.icns                  # 图标 SSOT（make_icon.py 生成）
depends_on:
  - Dev/tools/dev/lib/tools/macapp/check_codingkeys.py   # 构建期门①
  - Dev/tools/dev/lib/tools/macapp/hotkey_registry.py    # 构建期门②
  - Dev/tools/dev/lib/tools/macapp/make_icon.py          # 图标生成（一次性）
consumers: []
data_sources:
  - path: Library/Application Support/Clipbook/clipbook.sqlite3
    format: sqlite
    fields: id / kind / text / blob / hash / app_name / app_bundle / created_at / pinned / bytes / width / height
    override_env: CLIPBOOK_HOME
tier: APP
owner: tianli
docs: ./README.md
lifecycle: active
origin: own
form: mac
display_name: TL Clipbook
bundle_id: cyou.tianli.clipbook
icon:
  glyph: doc.on.clipboard.fill
  color: "#0f766e"
# 无 backend: 块 —— 全 Swift，无后端进程
