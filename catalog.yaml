name: clipbook
domain: apps-mac
function: >-
  自用剪贴板库（PastePal 形态，替代 Deck）。菜单栏常驻，点图标开主窗口：左栏按类型/来源 app/收藏夹筛，
  中栏自适应网格多选，右栏直接改正文（保存覆盖 / 另存新条）、改标题、一键转换、加收藏夹、复制/粘贴。
  记录文本/富文本/链接/图片/文件/代码/颜色，同内容去重顶上，置顶与收藏夹永不淘汰；首次启动自动导入 Deck 历史（只读）。
  **全 Swift 原生**（XcodeGen 构建，无 SPM / 无后端进程）；可选抓链接标题及 iCloud 历史归档，默认不启用同步。
  快捷键可配置，默认全部未绑定；只有用户明确保存的全局键才注册，不自动选择或退让。
public_api: "菜单栏常驻（安装名由 display_name 派生，点图标开窗口）· clipbook://show[?q=]|hide|toggle|settings · build/Clipbook --selftest"
key_scripts:
  - Sources/ClipbookApp.swift          # @main：--selftest 分流；NSStatusItem（左键开窗/右键菜单）；主窗口/设置窗口；URL scheme；首次启动导 Deck
  - Sources/Native/Store.swift         # SQLite：去重顶上、编辑覆盖（重识别类型/撞重删另一条）、收藏夹、合并、筛选分页、留存淘汰、blob 管理
  - Sources/Native/Classifier.swift    # 文本家族类型识别 SSOT（link / color / code / text），Watcher·编辑·导入三处共用
  - Sources/Native/Watcher.swift       # 轮询 changeCount；extract() 纯函数 = 抓取优先级（文件>文本(带RTF)>图片）+ 忽略名单 + 纯文本模式
  - Sources/Native/DeckImporter.swift  # 只读 Deck 库一次性导入（拷到临时目录再开）
  - Sources/Native/LinkTitle.swift     # 抓链接页面标题（可关）
  - Sources/Native/MacClipSync.swift   # 可选 iCloud 独立归档，与 iOS Clip 共用私有容器
  - Sources/Native/Paster.swift        # 写回剪贴板（含 RTF/文件/图片）+ CGEvent ⌘V（需辅助功能，不假装成功）
  - Sources/Native/ClipCopy.swift      # 标准⌘C与自定义复制共用：文本选区优先，否则复制全部所选记录
  - Sources/Native/Settings.swift      # UserDefaults 记录偏好 / 开机自启状态与失败反馈
  - Sources/Native/Shortcuts.swift     # 默认空绑定；录制、作用域、持久化、注销与错误；同一动作分发
  - Sources/Native/ShortcutSelfTest.swift # 默认零注册、冲突、持久化、解绑、注册故障与设置生效回归
  - Sources/Native/AppModel.swift      # 界面状态与动作（筛选/分页/多选/编辑/转换/收藏夹/导入）
  - Sources/Native/MainView.swift      # 三栏 NavigationSplitView
  - Sources/Native/SidebarView.swift   # 左栏筛选 + 收藏夹编辑
  - Sources/Native/GridView.swift      # 中栏网格卡片 + 批量条 + 搜索/分页
  - Sources/Native/DetailView.swift    # 右栏编辑器（保存/另存/转换/收藏/复制/粘贴）
  - Sources/Native/SettingsView.swift  # 设置窗口
  - Sources/Native/SelfTest.swift      # --selftest 判据（build.sh 阻断门，含 Deck 结构夹具）
  - build.sh                           # 转交 build-cloud.sh，XcodeGen + selftest + 描述文件签名 + 装机
  - icon/AppIcon.icns                  # 图标 SSOT（make_icon.py 生成）
depends_on:
  - Dev/tools/dev/lib/tools/macapp/check_codingkeys.py   # 构建期门①
  - Dev/tools/dev/lib/tools/macapp/make_icon.py          # 图标生成（一次性）
consumers: []
data_sources:
  - path: Library/Application Support/Clipbook/clipbook.sqlite3
    format: sqlite
    fields: id / kind / text / blob / hash / app_name / app_bundle / created_at / pinned / bytes / width / height
    override_env: CLIPBOOK_HOME
tier: APP
owner: tianli
docs: ./README.md
lifecycle: active
origin: own
form: mac
display_name: Clip
bundle_id: cyou.tianli.clipbook
icon_png: icon/AppIcon.png
# 无 backend: 块 —— 全 Swift，无后端进程
