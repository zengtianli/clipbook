name: clipbook
name_en: Clip
name_zh: 剪贴板
display_name: Clip · 剪贴板
family: clip
form: mac
lifecycle: active
bundle_id: cyou.tianli.clipbook
origin: own
sop:
  test: bash tests/test-link-title.sh
  # Agent CLI: same executable as the app (Contents/Resources/bin/clip -> ../../MacOS/Clipbook),
  # linked to ~/.local/bin/clip by scripts/install-cli.py after build.sh installs.
  cli:
    commands: [clip]
    app: cyou.tianli.clipbook
  accept:
    functionality: bash scripts/accept/functionality.sh
    recovery: bash scripts/accept/recovery.sh
    privacy: bash scripts/accept/privacy.sh
    native_ui: bash scripts/accept/native_ui.sh
  ui:
  - Sources/Native/*View.swift
  - Sources/Native/Settings.swift
  - Sources/Native/Shortcuts.swift
  - Sources/ClipbookApp.swift
  media:
  - docs/demo/*.png
  - docs/demo/*.mp4
  - promotion/video
  media_meta: docs/demo/recording.json
  release: build/local-release/release.json
  build_number: git-count
  site_build: ~/Dev/.venv/bin/python scripts/build-site.py
  site_deploy: products-only
  measure:
    archive: release
    env: clip
    data: 本机真实剪贴板库的快照副本（隔离数据目录，不碰原库）
  source:
  - Sources/**/*.swift
  - cloud-project.yml
  - Cloud.entitlements
  - icon/AppIcon.icns
  - build.sh
  - build-cloud.sh
  - release-local.sh
  - scripts/package-local.py
  - scripts/install-cli.py
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/clipbook
    rationale: 原生 Mac 剪贴板库。键盘顺手，轻量常驻，让查找与复用更快一步。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
